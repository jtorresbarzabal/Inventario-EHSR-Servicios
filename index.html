<style>
:root{
  --gold:#B8912F;
  --gold-dark:#8A6A1F;
  --ink:#211D17;
  --ink-soft:#54493A;
  --cream:#FAF5EA;
  --card:#FFFFFF;
  --line:#E7DEC9;
  --green:#3C7A4B;
  --green-bg:#E7F2E9;
  --amber:#B8790B;
  --amber-bg:#FBEFD9;
  --red:#B23A2E;
  --red-bg:#FBE7E4;
  --radius:14px;
  --shadow:0 2px 10px rgba(33,29,23,0.08);
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  padding-bottom:60px;
}
h1,h2,h3{font-family:'Playfair Display',serif;font-weight:600;margin:0;}
header{
  display:flex;align-items:center;gap:14px;
  padding:18px 18px 16px;
  border-bottom:3px solid var(--gold);
  background:linear-gradient(180deg, #FFFDF8 0%, var(--card) 100%);
  position:sticky;top:0;z-index:20;
}
header img{
  width:52px;height:52px;border-radius:50%;flex-shrink:0;
  border:2px solid var(--gold);
  box-shadow:0 0 0 3px var(--cream);
}
header .titulo{flex:1;min-width:0;}
header h1{font-size:19px;line-height:1.25;color:var(--ink);}
header .sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
#btnEdicion{
  border:1.5px solid var(--gold);
  background:var(--cream);
  color:var(--gold-dark);
  border-radius:999px;
  padding:8px 14px;
  font-size:13px;font-weight:600;
  font-family:'Inter',sans-serif;
  cursor:pointer;
  display:flex;align-items:center;gap:6px;
  white-space:nowrap;
}
#btnEdicion.activo{background:var(--gold);color:#fff;border-color:var(--gold);}

main{max-width:720px;margin:0 auto;padding:18px 14px;}

.familia{
  background:var(--card);
  border:1px solid var(--line);
  border-left:4px solid var(--gold);
  border-radius:var(--radius);
  margin-bottom:12px;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:box-shadow .2s ease;
}
.familia-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px;
  cursor:pointer;
  transition:background .15s ease;
}
.familia-header:hover{background:var(--cream);}
.familia-header h2{font-size:17px;color:var(--ink);}
.familia-header .contador{font-size:12.5px;color:var(--ink-soft);margin-top:3px;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:8px;}
.pill-alerta{
  background:var(--red-bg);color:var(--red);font-size:11px;font-weight:700;
  padding:2px 8px;border-radius:999px;
}
.familia-header .flecha{
  font-size:14px;color:var(--gold-dark);
  transition:transform .25s ease;
}
.familia.abierta .flecha{transform:rotate(180deg);}
.familia-cuerpo{
  border-top:1px solid var(--line);
  max-height:0;overflow:hidden;
  transition:max-height .32s ease;
}

.familia-toolbar{
  display:flex;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);
  flex-wrap:wrap;
}
.familia-toolbar input[type=text]{
  flex:1;min-width:120px;
  padding:9px 12px;border:1px solid var(--line);border-radius:10px;
  font-family:'Inter',sans-serif;font-size:13.5px;background:var(--cream);color:var(--ink);
}
.btn-mini{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:600;
  cursor:pointer;white-space:nowrap;font-family:'Inter',sans-serif;
}
.btn-mini.oro{border-color:var(--gold);color:var(--gold-dark);}

.item-row{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px 11px 11px;border-bottom:1px solid var(--line);cursor:pointer;
  border-left:4px solid var(--line);
  transition:background .15s ease;
}
.item-row:hover{background:var(--cream);}
.item-row:last-child{border-bottom:none;}
.item-foto{
  width:42px;height:42px;border-radius:9px;object-fit:cover;flex-shrink:0;background:var(--cream);
  border:1px solid var(--line);
}
.item-foto.vacia{display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--line);}
.item-info{flex:1;min-width:0;}
.item-nombre{font-size:14px;color:var(--ink);line-height:1.3;}
.item-meta{display:flex;align-items:center;gap:6px;margin-top:3px;}
.badge{
  font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;
  font-family:'Inter',sans-serif;
}
.badge.Bueno{background:var(--green-bg);color:var(--green);}
.badge.Dañado{background:var(--amber-bg);color:var(--amber);}
.badge.De.baja, .badge[data-estado="De baja"]{background:var(--red-bg);color:var(--red);}
.item-stock{font-size:19px;font-weight:700;color:var(--ink);min-width:34px;text-align:right;font-family:'Playfair Display',serif;}

.vacio-familia{padding:26px 18px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

/* Modal ficha */
.overlay{
  position:fixed;inset:0;background:rgba(33,29,23,0.55);
  display:none;align-items:flex-end;justify-content:center;z-index:100;
}
.overlay.abierto{display:flex;}
.panel{
  background:var(--cream);width:100%;max-width:520px;
  border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;
  padding:20px 20px 30px;
  animation:subir .22s ease;
}
@media (min-width:640px){
  .overlay{align-items:center;}
  .panel{border-radius:20px;max-height:88vh;}
}
@keyframes subir{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.panel-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.panel-top h2{font-size:19px;line-height:1.3;}
.panel-top .familia-tag{font-size:12px;color:var(--gold-dark);font-weight:600;margin-bottom:4px;}
.cerrar{background:none;border:none;font-size:22px;color:var(--ink-soft);cursor:pointer;line-height:1;padding:2px 6px;}

.foto-grande-wrap{position:relative;margin-bottom:16px;}
.foto-grande{
  width:100%;max-height:360px;object-fit:contain;border-radius:14px;background:#EFE7D5;
  border:1px solid var(--line);
}
.foto-grande.vacia{display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:13px;height:220px;}
.btn-foto{
  position:absolute;bottom:10px;right:10px;
  background:rgba(33,29,23,0.75);color:#fff;border:none;border-radius:999px;
  padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
}

.stock-box{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;margin-bottom:14px;
}
.stock-box .num{font-family:'Playfair Display',serif;font-size:38px;font-weight:700;}
.stock-box .lbl{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;}
.stock-btns{display:flex;gap:8px;}
.stock-btns button{
  width:42px;height:42px;border-radius:50%;border:1.5px solid var(--gold);
  background:var(--cream);color:var(--gold-dark);font-size:20px;font-weight:700;cursor:pointer;
}
.stock-btns button.mas{background:var(--gold);color:#fff;}

.estado-fila{margin-bottom:14px;}
.estado-fila .lbl{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:7px;display:block;}
.estado-opts{display:flex;gap:8px;}
.estado-opt{
  flex:1;padding:9px 6px;border-radius:10px;border:1.5px solid var(--line);
  text-align:center;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--card);color:var(--ink-soft);
}
.estado-opt.Bueno.sel{background:var(--green-bg);border-color:var(--green);color:var(--green);}
.estado-opt.Dañado.sel{background:var(--amber-bg);border-color:var(--amber);color:var(--amber);}
.estado-opt.Debaja.sel{background:var(--red-bg);border-color:var(--red);color:var(--red);}

.historial-titulo{font-size:13px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;margin:18px 0 8px;}
.mov{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
.mov:last-child{border-bottom:none;}
.mov .cant.Alta{color:var(--green);font-weight:700;}
.mov .cant.Baja{color:var(--red);font-weight:700;}
.mov .fecha{color:var(--ink-soft);font-size:11.5px;}
.mov-vacio{color:var(--ink-soft);font-size:13px;padding:6px 0;}

.edit-only{display:none;}
body.editando .edit-only{display:initial;}
body.editando .stock-btns{display:flex;}
.familia-toolbar .edit-only{display:none;}
body.editando .familia-toolbar .edit-only{display:inline-block;}

.aviso{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;
  font-size:13px;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,0.25);
  display:none;
}
.aviso.mostrar{display:block;}
.lightbox{
  position:fixed;inset:0;background:rgba(0,0,0,0.85);
  display:none;align-items:center;justify-content:center;z-index:300;
  cursor:zoom-out;padding:20px;
}
.lightbox.abierto{display:flex;}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;object-fit:contain;}
.cargando{padding:60px 20px;text-align:center;color:var(--ink-soft);font-size:14px;}
.msg-error{color:var(--red);font-size:12.5px;margin-top:6px;}
input[type=text],input[type=number],textarea{
  font-family:'Inter',sans-serif;
}
</style>
</head>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBiPf6RjlhdsBwN0S_SATI0e3lDebnzfgA",
  authDomain: "reservas-ehsr.firebaseapp.com",
  projectId: "reservas-ehsr",
  storageBucket: "reservas-ehsr.firebasestorage.app",
  messagingSenderId: "203020897249",
  appId: "1:203020897249:web:9ef0645201171a596f60a0"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwAwDZNDbK4EvyQi-ZkVj0D18MFSzby08A8OPSwv8Usl_ZCvQRWG06I_XHmoPQmBhFj/exec";

const FAMILIAS_ORDEN = ["Vajilla-Loza","Cubertería","Cristalería","Complementos","Mantelería-Lencería","Mobiliario","Maquinaria","Aula de Cata"];

let articulos = [];
let pinActual = null;
let familiaAbierta = null;

function avisar(texto){
  const el = document.getElementById('aviso');
  el.textContent = texto;
  el.classList.add('mostrar');
  setTimeout(()=>el.classList.remove('mostrar'), 2600);
}

/* ---------- CACHÉ LOCAL (carga instantánea en visitas repetidas) ---------- */

const CACHE_KEY = 'inventario_ehsr_cache_v2';

function guardarCache(datos){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({guardado: Date.now(), articulos: datos})); }catch(e){}
}
function leerCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

async function cargarDatos(usarCache){
  const cache = leerCache();
  if(usarCache && cache && cache.articulos && cache.articulos.length){
    articulos = cache.articulos;
    renderFamilias();
  } else {
    document.getElementById('main').innerHTML = '<div class="cargando">Cargando inventario…</div>';
  }
  try{
    const snap = await db.collection('articulos').get();
    articulos = snap.docs.map(d=>{
      const v = d.data();
      return {
        id: d.id,
        familia: v.familia || '',
        nombre: v.nombre || '',
        stock: Number(v.stock) || 0,
        estado: v.estado || 'Bueno',
        fotoUrl: v.fotoUrl || '',
        observaciones: v.observaciones || '',
      };
    });
    guardarCache(articulos);
    renderFamilias();
    if(familiaAbierta){
      const el = document.getElementById('fam-' + slug(familiaAbierta));
      if(el){ el.classList.add('abierta'); renderCuerpoFamilia(familiaAbierta); }
    }
  }catch(err){
    if(cache && cache.articulos && cache.articulos.length){
      avisar('No se pudo actualizar ahora mismo. Mostrando la última copia guardada.');
    } else {
      document.getElementById('main').innerHTML = '<div class="cargando">No se ha podido cargar el inventario.<br>' + err.message + '</div>';
    }
  }
}

/* ---------- LISTA DE FAMILIAS ---------- */

function contarPorFamilia(familia){ return articulos.filter(a=>a.familia===familia).length; }
function contarIncidenciasFamilia(familia){ return articulos.filter(a=>a.familia===familia && a.estado!=='Bueno').length; }
function slug(t){ return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-'); }

function renderFamilias(){
  const main = document.getElementById('main');
  main.innerHTML = '';
  FAMILIAS_ORDEN.forEach(fam=>{
    const n = contarPorFamilia(fam);
    const incidencias = contarIncidenciasFamilia(fam);
    const div = document.createElement('div');
    div.className = 'familia';
    div.id = 'fam-' + slug(fam);
    div.innerHTML = `
      <div class="familia-header" onclick="toggleFamilia('${fam}')">
        <div>
          <h2>${fam}</h2>
          <div class="contador">
            <span>${n} artículo${n===1?'':'s'}</span>
            ${incidencias>0?`<span class="pill-alerta">⚠ ${incidencias}</span>`:''}
          </div>
        </div>
        <div class="flecha">▾</div>
      </div>
      <div class="familia-cuerpo" id="cuerpo-${slug(fam)}"></div>
    `;
    main.appendChild(div);
  });
}

function toggleFamilia(familia){
  const el = document.getElementById('fam-' + slug(familia));
  const cuerpo = document.getElementById('cuerpo-' + slug(familia));
  const yaAbierta = el.classList.contains('abierta');
  document.querySelectorAll('.familia').forEach(f=>{
    f.classList.remove('abierta');
    const c = document.getElementById(f.id.replace('fam-','cuerpo-'));
    if(c) c.style.maxHeight = '0px';
  });
  if(!yaAbierta){
    el.classList.add('abierta');
    familiaAbierta = familia;
    renderCuerpoFamilia(familia);
  } else {
    familiaAbierta = null;
  }
}

function ajustarAltura(familia){
  const cuerpo = document.getElementById('cuerpo-' + slug(familia));
  const el = document.getElementById('fam-' + slug(familia));
  if(el && cuerpo && el.classList.contains('abierta')){
    cuerpo.style.maxHeight = cuerpo.scrollHeight + 'px';
  }
}

function bordeEstado(estado){
  if(estado==='Dañado') return 'var(--amber)';
  if(estado==='De baja') return 'var(--red)';
  return 'var(--green)';
}
function estadoEstilo(estado){
  if(estado==='Dañado') return 'background:var(--amber-bg);color:var(--amber);';
  if(estado==='De baja') return 'background:var(--red-bg);color:var(--red);';
  return 'background:var(--green-bg);color:var(--green);';
}

function renderCuerpoFamilia(familia){
  const cuerpo = document.getElementById('cuerpo-' + slug(familia));
  cuerpo.innerHTML = `
    <div class="familia-toolbar">
      <input type="text" placeholder="Buscar en ${familia}…" oninput="renderItemsFamilia('${familia}', this.value)">
      <button class="btn-mini" onclick="exportarPDF('${familia}')">📄 PDF</button>
      <button class="btn-mini oro edit-only" onclick="mostrarNuevoArticulo('${familia}')">+ Añadir</button>
    </div>
    <div id="items-${slug(familia)}"></div>
  `;
  renderItemsFamilia(familia, '');
}

function renderItemsFamilia(familia, filtro){
  filtro = (filtro||'').toLowerCase();
  const cont = document.getElementById('items-' + slug(familia));
  if(!cont) return;
  const items = articulos.filter(a=>a.familia===familia && a.nombre.toLowerCase().includes(filtro))
                          .sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  let html = '';
  if(items.length===0){
    html = '<div class="vacio-familia">No hay artículos que coincidan.</div>';
  } else {
    items.forEach(it=>{
      const fotoHtml = it.fotoUrl
        ? `<img class="item-foto" src="${it.fotoUrl}" loading="lazy">`
        : `<div class="item-foto vacia">—</div>`;
      const stockEstilo = it.stock===0 ? 'color:var(--red);' : '';
      html += `
        <div class="item-row" style="border-left-color:${bordeEstado(it.estado)};" onclick="abrirFicha('${it.id}')">
          ${fotoHtml}
          <div class="item-info">
            <div class="item-nombre">${it.nombre}</div>
            <div class="item-meta"><span class="badge" data-estado="${it.estado}" style="${estadoEstilo(it.estado)}">${it.estado}</span></div>
          </div>
          <div class="item-stock" style="${stockEstilo}">${it.stock}</div>
        </div>
      `;
    });
  }
  cont.innerHTML = html;
  requestAnimationFrame(()=>ajustarAltura(familia));
}

/* ---------- FICHA DE ARTÍCULO ---------- */

function abrirFicha(id){
  const it = articulos.find(a=>a.id===id);
  if(!it) return;
  const overlay = document.getElementById('overlayFicha');
  const panel = document.getElementById('panelFicha');
  panel.dataset.id = id;
  const fotoInicial = it.fotoUrl
    ? `<img class="foto-grande" id="fotoGrande" src="${it.fotoUrl}" onclick="abrirLightbox('${it.fotoUrl}')" style="cursor:zoom-in;">`
    : `<div class="foto-grande vacia" id="fotoGrande">Sin foto</div>`;
  panel.innerHTML = `
    <div class="panel-top">
      <div>
        <div class="familia-tag">${it.familia}</div>
        <h2 id="fichaNombre">${it.nombre}</h2>
      </div>
      <button class="cerrar" onclick="cerrarFicha()">✕</button>
    </div>
    <div class="edit-only" style="margin-bottom:14px;">
      <button class="btn-mini" onclick="renombrarArticuloUI('${it.id}')" style="margin-right:8px;">✏️ Renombrar</button>
      <button class="btn-mini" style="color:var(--red);border-color:var(--red);" onclick="eliminarArticuloUI('${it.id}')">🗑️ Eliminar artículo</button>
    </div>
    <div class="foto-grande-wrap">
      ${fotoInicial}
      <button class="btn-foto edit-only" onclick="document.getElementById('inputFoto').click()">📷 Foto</button>
    </div>
    <div class="stock-box">

      </span>
      <div id="observacionesTexto" style="font-size:13.5px;color:var(--ink);${it.observaciones?'':'color:var(--ink-soft);font-style:italic;'}">${it.observaciones ? it.observaciones : 'Sin observaciones.'}</div>
    </div>
    <div class="historial-titulo" style="display:flex;justify-content:space-between;align-items:center;">

function abrirLightbox(url){
  if(!url) return;
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').classList.add('abierto');
}
function cerrarLightbox(){
  document.getElementById('lightbox').classList.remove('abierto');
}

function cerrarFicha(){
  document.getElementById('overlayFicha').classList.remove('abierto');
}

async function cargarHistorial(id){
  const box = document.getElementById('historialBox');
  try{
    const snap = await db.collection('articulos').doc(id).collection('movimientos').orderBy('fecha','desc').limit(50).get();
    if(!box) return;
    if(snap.empty){
      box.innerHTML = '<div class="mov-vacio">Sin movimientos registrados todavía.</div>';
      return;
    }
    box.innerHTML = snap.docs.map(d=>{
      const m = d.data();
      const f = m.fecha && m.fecha.toDate ? m.fecha.toDate() : new Date();
      const fechaTxt = f.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});
      const signo = m.tipo==='Alta' ? '+' : '−';
      return `<div class="mov" id="mov-${d.id}">
        <div><div class="cant ${m.tipo}">${signo}${m.cantidad}</div>${m.motivo?`<div style="color:var(--ink-soft);font-size:12px;">${m.motivo}</div>`:''}</div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="fecha">${fechaTxt}</div>
          <button class="edit-only" style="border:none;background:none;color:var(--red);cursor:pointer;font-size:14px;padding:2px;" onclick="eliminarMovimientoUI('${d.id}','${id}')" title="Borrar este movimiento">🗑️</button>
        </div>
      </div>`;
    }).join('');
  }catch(err){
    if(box) box.innerHTML = '<div class="mov-vacio">No se pudo cargar el historial.</div>';
  }
}

async function editarObservacionesUI(id){
  const it = articulos.find(a=>a.id===id);
  if(!it) return;
  const nuevo = prompt('Observaciones del artículo (ej: 7 en buen estado, 2 rotas):', it.observaciones || '');
  if(nuevo===null) return;
  const anterior = it.observaciones;
  it.observaciones = nuevo.trim();
  const div = document.getElementById('observacionesTexto');
  if(div){
    div.textContent = it.observaciones || 'Sin observaciones.';
    div.style.cssText = 'font-size:13.5px;color:var(--ink);' + (it.observaciones ? '' : 'color:var(--ink-soft);font-style:italic;');
  }
  try{
    await db.collection('articulos').doc(id).update({observaciones: it.observaciones});
    avisar('Observaciones guardadas.');
  }catch(e){
    it.observaciones = anterior;
    if(div){
      div.textContent = it.observaciones || 'Sin observaciones.';
      div.style.cssText = 'font-size:13.5px;color:var(--ink);' + (it.observaciones ? '' : 'color:var(--ink-soft);font-style:italic;');

}

/* ---------- EDICIÓN (PIN) ---------- */

function alternarEdicion(){
  if(document.body.classList.contains('editando')){
    document.body.classList.remove('editando');
    pinActual = null;
    document.getElementById('btnEdicion').classList.remove('activo');
    document.getElementById('btnEdicion').textContent = '🔒 Editar';
    actualizarVisibilidadEdicion();
    return;
  }
  const intento = prompt('Introduce el PIN para editar el inventario:');
  if(intento===null) return;
  pinActual = intento;
  document.body.classList.add('editando');
  document.getElementById('btnEdicion').classList.add('activo');
  document.getElementById('btnEdicion').textContent = '🔓 Editando';
  actualizarVisibilidadEdicion();

function actualizarVisibilidadEdicion(){
  const editando = document.body.classList.contains('editando');
  document.querySelectorAll('.stock-btns').forEach(el=>el.style.display = editando ? 'flex' : 'none');
  document.querySelectorAll('#estadoOpts').forEach(el=>el.style.display = editando ? 'flex' : 'none');
  const badge = document.getElementById('estadoBadgeSoloLectura');
  if(badge) badge.style.display = editando ? 'none' : 'inline-block';

/* ---------- MOVIMIENTOS DE STOCK (optimistas) ---------- */

async function pedirMovimiento(id, tipo){
  const cantidadTxt = prompt(tipo==='Alta' ? '¿Cuántas unidades entran?' : '¿Cuántas unidades salen o se dan de baja?');
  if(cantidadTxt===null) return;
  const cantidad = parseInt(cantidadTxt,10);
  if(isNaN(cantidad) || cantidad<=0){ avisar('Introduce un número válido mayor que 0.'); return; }
  const motivo = prompt('Motivo (opcional, ej: reposición, rotura...)') || '';

  const it = articulos.find(a=>a.id===id);
  const stockAnterior = it.stock;
  const stockOptimista = Math.max(0, stockAnterior + (tipo==='Alta' ? cantidad : -cantidad));
  it.stock = stockOptimista;
  const numEl = document.getElementById('stockNum');
  if(numEl) numEl.textContent = stockOptimista;
  if(familiaAbierta) renderItemsFamilia(familiaAbierta);

  try{
    const ref = db.collection('articulos').doc(id);
    let nuevoStock;
    await db.runTransaction(async (tx)=>{
      const doc = await tx.get(ref);
      const actual = Number(doc.data().stock) || 0;
      const delta = tipo==='Alta' ? Number(cantidad) : -Number(cantidad);
      nuevoStock = Math.max(0, actual + delta);
      tx.update(ref, {stock: nuevoStock});
    });
    await ref.collection('movimientos').add({
      fecha: firebase.firestore.FieldValue.serverTimestamp(),
      cantidad: Number(cantidad), tipo, motivo: motivo || ''
    });
    it.stock = nuevoStock;
    if(numEl) numEl.textContent = nuevoStock;
    if(familiaAbierta) renderItemsFamilia(familiaAbierta);
    cargarHistorial(id);
    avisar('Stock actualizado.');
  }catch(e){
    it.stock = stockAnterior;
    if(numEl) numEl.textContent = stockAnterior;
    if(familiaAbierta) renderItemsFamilia(familiaAbierta);
    avisar('Error al guardar: ' + e.message);
  }
}

async function cambiarEstado(id, estado){
  const it = articulos.find(a=>a.id===id);
  const estadoAnterior = it.estado;
  it.estado = estado;
  const opts = document.getElementById('estadoOpts');
  if(opts) [...opts.children].forEach(el=>el.classList.toggle('sel', el.textContent.trim()===estado));
  if(familiaAbierta) renderItemsFamilia(familiaAbierta);
  try{
    await db.collection('articulos').doc(id).update({estado});
    avisar('Estado actualizado.');
  }catch(e){
    it.estado = estadoAnterior;
    if(opts) [...opts.children].forEach(el=>el.classList.toggle('sel', el.textContent.trim()===estadoAnterior));
    if(familiaAbierta) renderItemsFamilia(familiaAbierta);
    avisar('Error al guardar: ' + e.message);
  }
}

/* ---------- HISTORIAL: BORRAR ---------- */

async function eliminarMovimientoUI(movimientoId, articuloId){
  if(!confirm('¿Borrar este movimiento del historial? El stock actual no cambiará.')) return;
  const fila = document.getElementById('mov-' + movimientoId);
  if(fila) fila.remove();
  try{
    await db.collection('articulos').doc(articuloId).collection('movimientos').doc(movimientoId).delete();
    avisar('Movimiento borrado.');
  }catch(e){
    cargarHistorial(articuloId);
  }
}

async function borrarHistorialUI(articuloId){
  if(!confirm('¿Vaciar TODO el historial de este artículo? Esta acción no se puede deshacer. El stock actual no cambiará.')) return;
  const box = document.getElementById('historialBox');
  if(box) box.innerHTML = '<div class="mov-vacio">Sin movimientos registrados todavía.</div>';
  try{
    const snap = await db.collection('articulos').doc(articuloId).collection('movimientos').get();
    const batch = db.batch();
    snap.docs.forEach(d=>batch.delete(d.ref));
    await batch.commit();
    avisar('Historial vaciado.');
  }catch(e){
    cargarHistorial(articuloId);
  }
}

/* ---------- ARTÍCULOS: AÑADIR / RENOMBRAR / ELIMINAR ---------- */

async function mostrarNuevoArticulo(familia){
  const nombre = prompt('Nombre del nuevo artículo en "' + familia + '":');
  if(!nombre || !nombre.trim()) return;
  try{
    let maxNum = 0;
    articulos.forEach(a=>{ const m=a.id.match(/A(\d+)/); if(m) maxNum=Math.max(maxNum,parseInt(m[1],10)); });
    const nuevoId = 'A' + String(maxNum+1).padStart(4,'0');
    const nuevo = {familia, nombre: nombre.trim(), stock:0, estado:'Bueno', fotoUrl:'', observaciones:''};
    await db.collection('articulos').doc(nuevoId).set(nuevo);
    articulos.push(Object.assign({id: nuevoId}, nuevo));
    guardarCache(articulos);
    renderFamilias();
    document.getElementById('fam-' + slug(familia)).classList.add('abierta');
    familiaAbierta = familia;
    renderCuerpoFamilia(familia);
    avisar('Artículo añadido.');
  }catch(e){ avisar('Error: ' + e.message); }
}

async function renombrarArticuloUI(id){
  const it = articulos.find(a=>a.id===id);
  if(!it) return;
  const nuevo = prompt('Nuevo nombre del artículo:', it.nombre);
  if(!nuevo || !nuevo.trim() || nuevo.trim()===it.nombre) return;
  const anterior = it.nombre;
  it.nombre = nuevo.trim();
  const h2 = document.getElementById('fichaNombre');
  if(h2) h2.textContent = it.nombre;
  if(familiaAbierta) renderItemsFamilia(familiaAbierta);
  try{
    await db.collection('articulos').doc(id).update({nombre: nuevo.trim()});
    avisar('Artículo renombrado.');
  }catch(e){
    it.nombre = anterior;
    if(h2) h2.textContent = anterior;
    if(familiaAbierta) renderItemsFamilia(familiaAbierta);
    avisar('Error: ' + e.message);
  }
}

async function eliminarArticuloUI(id){
  const it = articulos.find(a=>a.id===id);
  if(!it) return;
  if(!confirm('¿Seguro que quieres eliminar "' + it.nombre + '" del inventario? Esta acción no se puede deshacer.')) return;
  try{
    await db.collection('articulos').doc(id).delete();
    articulos = articulos.filter(a=>a.id!==id);
    guardarCache(articulos);
    cerrarFicha();
    const familiaActual = familiaAbierta;
    renderFamilias();
    if(familiaActual){
      document.getElementById('fam-' + slug(familiaActual)).classList.add('abierta');
      familiaAbierta = familiaActual;
      renderCuerpoFamilia(familiaActual);
    }
    avisar('Artículo eliminado.');
  }catch(e){ avisar('Error: ' + e.message); }
}

/* ---------- FOTOS ---------- */

function fetchConTimeout(url, opciones, ms){
  return Promise.race([
    fetch(url, opciones),
    new Promise((_, reject) => setTimeout(() => reject(new Error('Tiempo de espera agotado')), ms))
  ]);
}

async function subirFotoDriveConReintento(id, dataUriGrande, esReintento){
  try{
    const res = await fetchConTimeout(APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({pin: pinActual, action:'subirFotoDrive', id, dataUriGrande})
    }, 20000);
    return await res.json();
  }catch(e){
    if(!esReintento){
      await new Promise(r=>setTimeout(r, 800));
      return subirFotoDriveConReintento(id, dataUriGrande, true);
    }
    return { ok:false, error: 'No se pudo conectar con Drive (' + e.message + ')' };
  }
}

document.getElementById('inputFoto').addEventListener('change', async function(e){
  const file = e.target.files[0];
  if(!file) return;
  const panel = document.getElementById('panelFicha');
  const id = panel.dataset.id;
  try{
    const { dataUriGrande, dataUriPeque } = await comprimirImagen(file);
    let fg = document.getElementById('fotoGrande');
    if(fg) fg.outerHTML = `<img class="foto-grande" id="fotoGrande" src="${dataUriGrande}" onclick="abrirLightbox('${dataUriGrande}')" style="cursor:zoom-in;opacity:0.7;">`;
    avisar('Subiendo a Drive… puede tardar hasta 20 segundos.');

    const resultado = await subirFotoDriveConReintento(id, dataUriGrande);
    if(!resultado.ok) throw new Error(resultado.error || 'No se pudo subir la foto');

    await db.collection('articulos').doc(id).update({fotoUrl: resultado.url});
    const it = articulos.find(a=>a.id===id);
    if(it){
      it.fotoUrl = resultado.url;
      await db.collection('fotosPdf').doc(id).set({familia: it.familia, data: dataUriPeque});
    }

    fg = document.getElementById('fotoGrande');
    if(fg) fg.style.opacity = '1';
    if(familiaAbierta) renderItemsFamilia(familiaAbierta);
    avisar('Foto guardada.');
  }catch(err){
    avisar('No se pudo guardar la foto: ' + err.message);
  }
  e.target.value = '';
});

function comprimirImagen(file){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = function(ev){
      img.onload = function(){
        function generar(maxDim, calidadInicial, limiteBytes){
          let w = img.width, h = img.height;
          if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
          else if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          let calidad = calidadInicial;
          let dataUri = canvas.toDataURL('image/jpeg', calidad);
          while(dataUri.length > limiteBytes && calidad > 0.15){
            calidad -= 0.1;
            dataUri = canvas.toDataURL('image/jpeg', calidad);
          }
          return dataUri;
        }
        try{
          const dataUriGrande = generar(800, 0.72, 350000);  // buena calidad, para Drive (algo más ligera = subida más rápida)
          const dataUriPeque = generar(220, 0.6, 22000);      // miniatura para el PDF, algo mayor para que no se vea borrosa
          resolve({dataUriGrande, dataUriPeque});
        }catch(err){ reject(new Error('No se pudo procesar la imagen.')); }
      };
      img.onerror = ()=>reject(new Error('No se pudo leer la imagen.'));
      img.src = ev.target.result;
    };
    reader.onerror = ()=>reject(new Error('No se pudo leer el archivo.'));
    reader.readAsDataURL(file);
  });
}

/* ---------- EXPORTAR PDF ---------- */

async function exportarPDF(familia){
  avisar('Generando PDF de ' + familia + '…');
  const items = articulos.filter(a=>a.familia===familia).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));

  let fotos = {};
  try{
    const snap = await db.collection('fotosPdf').where('familia','==',familia).get();
    snap.docs.forEach(d=>{ fotos[d.id] = d.data().data; });
  }catch(e){}

  function cargarDimension(dataUri){
    return new Promise(resolve=>{
      const img = new Image();
      img.onload = ()=>resolve({w:img.naturalWidth||1, h:img.naturalHeight||1});
      img.onerror = ()=>resolve({w:1,h:1});
      img.src = dataUri;
    });
  }
  const dimensiones = {};
  await Promise.all(Object.keys(fotos).map(async id=>{
    dimensiones[id] = await cargarDimension(fotos[id]);
  }));

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const pageW = 595, marginX = 40, contentR = 555;
  const colorGold = [184,145,47], colorInk = [33,29,23], colorInkSoft = [110,100,85];
  const colorGreen = [60,122,75], colorAmber = [184,121,11], colorRed = [178,58,46];
  const colorLine = [231,222,201], colorRowAlt = [250,245,234];

  function colorEstado(estado){
    if(estado==='Dañado') return colorAmber;
    if(estado==='De baja') return colorRed;
    return colorGreen;
  }

  function dibujarCabecera(){
    doc.setFillColor(...colorGold);
    doc.rect(0, 0, pageW, 64, 'F');
    const logoSrc = document.querySelector('header img').src;
    try{ doc.addImage(logoSrc, 'JPEG', marginX, 12, 40, 40); }catch(e){}
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold');
    doc.setFontSize(15);
    doc.text('Inventario Servicios de Restauración', marginX + 52, 30);
    doc.setFont('helvetica','normal');
    doc.setFontSize(10.5);
    doc.text('Escuela de Hostelería San Roque', marginX + 52, 46);

    doc.setTextColor(...colorInk);
    let y = 92;
    doc.setFont('helvetica','bold');
    doc.setFontSize(17);
    doc.text(familia, marginX, y);
    doc.setFont('helvetica','normal');
    doc.setFontSize(10);
    doc.setTextColor(...colorInkSoft);
    const fechaHoy = new Date().toLocaleDateString('es-ES', {day:'2-digit', month:'2-digit', year:'numeric'});
    doc.text('Exportado el ' + fechaHoy + '  ·  ' + items.length + ' artículos', marginX, y + 16);
    y += 34;

    doc.setFillColor(...colorRowAlt);
    doc.rect(marginX, y, contentR - marginX, 20, 'F');
    doc.setFont('helvetica','bold');
    doc.setFontSize(9.5);
    doc.setTextColor(...colorInkSoft);
    doc.text('ARTÍCULO', marginX + 46, y + 14);
    doc.text('STOCK', contentR - 12, y + 14, {align:'right'});
    doc.setTextColor(...colorInk);
    return y + 20;
  }

  let y = dibujarCabecera();
  const filaAltura = 80;
  const fotoLado = 56;
  let filaPar = false;

  for(const it of items){
    if(y + filaAltura > 790){
      doc.addPage();
      y = dibujarCabecera();
      filaPar = false;
    }
    if(filaPar){
      doc.setFillColor(...colorRowAlt);
      doc.rect(marginX, y, contentR - marginX, filaAltura, 'F');
    }
    filaPar = !filaPar;

    const fotoItem = fotos[it.id];
    if(fotoItem){
      const dim = dimensiones[it.id] || {w:1,h:1};
      let dw = fotoLado, dh = fotoLado;
      if(dim.w > dim.h){ dh = fotoLado * dim.h / dim.w; }
      else if(dim.h > dim.w){ dw = fotoLado * dim.w / dim.h; }
      const ox = marginX + 6 + (fotoLado - dw)/2;
      const oy = y + 5 + (fotoLado - dh)/2;
      try{ doc.addImage(fotoItem, 'JPEG', ox, oy, dw, dh); }catch(e){}
    } else {
      doc.setDrawColor(...colorLine);
      doc.rect(marginX + 6, y + 5, fotoLado, fotoLado);
    }

    doc.setFont('helvetica','bold');
    doc.setFontSize(11);
    doc.setTextColor(...colorInk);
    doc.text(it.nombre, marginX + 72, y + 22, {maxWidth: 320});

    doc.setFont('helvetica','bold');
    doc.setFontSize(9);
    doc.setTextColor(...colorInkSoft);
    doc.text('Estado:', marginX + 72, y + 38);

    const ce = colorEstado(it.estado);
    doc.setFillColor(...ce);
    doc.circle(marginX + 100, y + 35, 2.4, 'F');
    doc.setFont('helvetica','normal');
    doc.setFontSize(9);
    doc.setTextColor(...ce);
    doc.text(it.estado, marginX + 106, y + 38);

    if(it.observaciones){
      doc.setFont('helvetica','italic');
      doc.setFontSize(8.5);
      doc.setTextColor(...colorInkSoft);
      doc.text(it.observaciones, marginX + 72, y + 52, {maxWidth: 320});
    }

    doc.setFont('helvetica','bold');
    doc.setFontSize(15);
    doc.setTextColor(...colorInk);
    doc.text(String(it.stock), contentR - 12, y + 38, {align:'right'});

    doc.setDrawColor(...colorLine);
    doc.line(marginX, y + filaAltura, contentR, y + filaAltura);
    y += filaAltura;
  }

  const totalPaginas = doc.internal.getNumberOfPages();
  for(let p = 1; p <= totalPaginas; p++){
    doc.setPage(p);
    doc.setDrawColor(...colorLine);
    doc.line(marginX, 812, contentR, 812);
    doc.setFont('helvetica','normal');
    doc.setFontSize(8.5);
    doc.setTextColor(...colorInkSoft);
    doc.text('Inventario Servicios de Restauración · ' + familia, marginX, 826);
    doc.text('Página ' + p + ' de ' + totalPaginas, contentR, 826, {align:'right'});
  }

  doc.save('Inventario - ' + familia + '.pdf');
}
